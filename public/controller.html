<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Controle Beyblade</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            padding: 15px;
        }
        
        .container {
            width: 100%;
            max-width: 420px;
        }
        
        h1 {
            color: #ffd700;
            text-align: center;
            font-size: 22px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }
        
        /* Seleção de Vencedor */
        .selecao {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .selecao button {
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border: 3px solid transparent;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }
        
        #btn-p1 {
            background: #1565C0;
        }
        
        #btn-p2 {
            background: #C62828;
        }
        
        .selecao button.ativo {
            border-color: #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
            transform: scale(1.02);
        }
        
        .selecao button:active {
            transform: scale(0.95);
        }
        
        /* Botões de Ação */
        .botoes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .botoes button {
            padding: 25px 10px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            color: white;
            transition: transform 0.1s;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .botoes button:active {
            transform: scale(0.92);
        }
        
        #btn-burst { background: linear-gradient(135deg, #ff1744, #d50000); }
        #btn-xtreme { background: linear-gradient(135deg, #ff9100, #e65100); }
        #btn-over { background: linear-gradient(135deg, #00bcd4, #006064); }
        #btn-spin { background: linear-gradient(135deg, #4caf50, #1b5e20); }
        
        .botoes button .emoji {
            display: block;
            font-size: 28px;
            margin-bottom: 5px;
        }
        
        /* Utilitários */
        .utilitarios {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .utilitarios button {
            padding: 12px;
            font-size: 14px;
            border: 2px solid #333;
            border-radius: 8px;
            background: #1a1a1a;
            color: #aaa;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .utilitarios button:active {
            background: #333;
            transform: scale(0.95);
        }
        
        /* Status */
        #status {
            text-align: center;
            color: #666;
            font-size: 13px;
            padding: 10px;
            background: #111;
            border-radius: 8px;
        }
        
        #status.conectado {
            color: #4caf50;
        }
        
        #status.desconectado {
            color: #f44336;
        }
        
        /* Indicador do vencedor */
        .indicador {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 15px;
            padding: 10px;
            background: #111;
            border-radius: 8px;
        }
        
        .indicador span {
            color: #ffd700;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚔️ CONTROLE BEYBLADE</h1>
        
        <!-- Quem vai vencer? -->
        <div class="selecao">
            <button id="btn-p1" class="ativo">🔵 Jogador 1</button>
            <button id="btn-p2">🔴 Jogador 2</button>
        </div>
        
        <div class="indicador">
            Vencedor selecionado: <span id="vencedor-nome">Jogador 1</span>
        </div>
        
        <!-- Botões de Ação -->
        <div class="botoes">
            <button id="btn-burst">
                <span class="emoji">💥</span>
                BURST
            </button>
            <button id="btn-xtreme">
                <span class="emoji">🔥</span>
                XTREME
            </button>
            <button id="btn-over">
                <span class="emoji">💨</span>
                OVER
            </button>
            <button id="btn-spin">
                <span class="emoji">🌀</span>
                SPIN
            </button>
        </div>
        
        <!-- Utilitários -->
        <div class="utilitarios">
            <button id="btn-reset">🔄 Reset</button>
            <button id="btn-ponto1">➕ P1</button>
            <button id="btn-ponto2">➕ P2</button>
        </div>
        
        <div id="status">🔌 Conectando...</div>
    </div>

    <script>
        // Conecta ao servidor
        const socket = io();
        let vencedorAtual = 'player1';
        const statusDiv = document.getElementById('status');
        const vencedorNome = document.getElementById('vencedor-nome');
        
        // Status de conexão
        socket.on('connect', () => {
            statusDiv.textContent = '✅ Conectado ao servidor!';
            statusDiv.className = 'conectado';
        });
        
        socket.on('disconnect', () => {
            statusDiv.textContent = '❌ Desconectado!';
            statusDiv.className = 'desconectado';
        });
        
        // Selecionar vencedor
        document.getElementById('btn-p1').addEventListener('click', function() {
            vencedorAtual = 'player1';
            document.getElementById('btn-p1').classList.add('ativo');
            document.getElementById('btn-p2').classList.remove('ativo');
            vencedorNome.textContent = 'Jogador 1';
        });
        
        document.getElementById('btn-p2').addEventListener('click', function() {
            vencedorAtual = 'player2';
            document.getElementById('btn-p2').classList.add('ativo');
            document.getElementById('btn-p1').classList.remove('ativo');
            vencedorNome.textContent = 'Jogador 2';
        });
        
        // Função para enviar comando
        function enviarComando(tipo) {
            const dados = {
                type: tipo,
                winner: vencedorAtual
            };
            socket.emit('comando', dados);
            
            // Feedback visual no botão
            const btn = document.getElementById(`btn-${tipo}`);
            if (btn) {
                btn.style.transform = 'scale(0.9)';
                setTimeout(() => {
                    btn.style.transform = 'scale(1)';
                }, 100);
            }
        }
        
        // Associar botões de ação
        document.getElementById('btn-burst').addEventListener('click', () => enviarComando('burst'));
        document.getElementById('btn-xtreme').addEventListener('click', () => enviarComando('xtreme'));
        document.getElementById('btn-over').addEventListener('click', () => enviarComando('over'));
        document.getElementById('btn-spin').addEventListener('click', () => enviarComando('spin'));
        
        // Utilitários
        document.getElementById('btn-reset').addEventListener('click', () => {
            socket.emit('comando', { type: 'reset' });
        });
        
        document.getElementById('btn-ponto1').addEventListener('click', () => {
            socket.emit('comando', { type: 'ponto', winner: 'player1' });
        });
        
        document.getElementById('btn-ponto2').addEventListener('click', () => {
            socket.emit('comando', { type: 'ponto', winner: 'player2' });
        });
    </script>
</body>
</html>
