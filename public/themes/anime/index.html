<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Prototype HUD - Score BeyX</title>

   <link rel="stylesheet" href="/themes/anime/styles/base.css">
    <link rel="stylesheet" href="/themes/anime/styles/responsive.css">
    <link rel="stylesheet" href="/themes/anime/styles/loading-screen.css">
    <link rel="stylesheet" href="/themes/anime/styles/score-counter.css">
    <link rel="stylesheet" href="/themes/anime/styles/player-card.css">
    <link rel="stylesheet" href="/themes/anime/styles/background.css">
    <link rel="stylesheet" href="/themes/anime/styles/finish-banner.css">
    <link rel="stylesheet" href="/themes/anime/styles/winner-screen.css">
</head>

<body>
        <button
        id="fullscreen-button"
        class="fullscreen-button"
        type="button"
        aria-label="Entrar em tela cheia"
        title="Tela cheia">
        <span class="fullscreen-icon" aria-hidden="true">
            ⛶
        </span>
    </button>

    <div class="tech-background" aria-hidden="true">
        <div id="tech-shapes" class="tech-shapes"></div>

                <div
            id="tech-particles"
            class="tech-particles"
        ></div>

        <div class="tech-grid"></div>
        <div class="screen-vignette"></div>
    </div>

    <section
        id="loading-screen"
        class="loading-screen"
        aria-live="polite"
    >
        <div class="loading-panel">
            <p class="loading-kicker">
                SCORE BEYX SYSTEM
            </p>

            <h1>INITIALIZING</h1>

            <p
                id="loading-status"
                class="loading-status"
            >
                Preparando carregamento...
            </p>

            <div
                class="loading-progress-track"
                aria-hidden="true"
            >
                <div
                    id="loading-progress-bar"
                    class="loading-progress-bar"
                ></div>
            </div>

            <p
                id="loading-progress-text"
                class="loading-progress-text"
            >
                0%
            </p>
        </div>
    </section>

    <main
        id="prototype-hud"
        class="prototype-hud is-loading"
    >
        <p id="connection-status" class="connection-status">
            Aguardando inicialização...
        </p>

        <section class="battle-stage">
            <article
                id="player1-card"
                class="player-card player-card-left"
            >
                <h2 id="player1-bey-name" class="bey-name">
                    Dran Sword
                </h2>

                <div class="bey-frame">
                    <img
                        id="player1-bey-image"
                        class="bey-image"
                        alt="Bey do Jogador 1"
                    >

                    <div class="bey-fallback">
                        BEY 1
                    </div>
                </div>
            </article>

            <section class="score-center" aria-label="Placar">
                <div class="score-line">
                    <span
                        id="player1-score"
                        class="score-number"
                    >
                        0
                    </span>

                    <span class="score-divider">-</span>

                    <span
                        id="player2-score"
                        class="score-number"
                    >
                        0
                    </span>
                </div>

                <p class="round-label">
                    ROUND
                    <span id="battle-round">1</span>
                </p>
            </section>

            <article
                id="player2-card"
                class="player-card player-card-right"
            >
                <h2 id="player2-bey-name" class="bey-name">
                    Wizard Arrow
                </h2>

                <div class="bey-frame">
                    <img
                        id="player2-bey-image"
                        class="bey-image"
                        alt="Bey do Jogador 2"
                    >

                    <div class="bey-fallback">
                        BEY 2
                    </div>
                </div>
            </article>
        </section>

        <section
            id="finish-overlay"
            class="event-overlay"
            aria-live="polite"
        >
            <div class="event-backdrop"></div>

            <div class="finish-banner">
                <span id="finish-title">
                    BURST FINISH
                </span>
            </div>
        </section>

        <section
            id="winner-overlay"
            class="winner-overlay"
            aria-live="polite"
        >
            <div class="winner-glow"></div>

            <img
                id="winner-background-image"
                class="winner-background-image"
                src=""
                alt=""
            >

            <img
                id="winner-bey-image"
                class="winner-bey-image"
                src=""
                alt=""
            >

            <div class="winner-copy">
                <p class="winner-label">WINNER</p>

                <h2 id="winner-bey-name">
                    Bey vencedor
                </h2>
            </div>
        </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>

    <script src="/themes/anime/config/assets.js"></script>

    <script src="/themes/anime/loaders/ImageLoader.js"></script>
    <script src="/themes/anime/loaders/FontLoader.js"></script>
    <script src="/themes/anime/loaders/AudioLoader.js"></script>
    <script src="/themes/anime/loaders/VideoLoader.js"></script>
    <script src="/themes/anime/loaders/AssetLoader.js"></script>

    <script src="/themes/anime/vendor/gsap.min.js"></script>

    <script src="/themes/anime/components/LoadingScreen.js"></script>
    <script src="/themes/anime/components/Background.js"></script>
    <script src="/themes/anime/components/FinishBanner.js"></script>
    <script src="/themes/anime/components/ScoreCounter.js"></script>
    <script src="/themes/anime/components/PlayerCard.js"></script>
    <script src="/themes/anime/components/WinnerScreen.js"></script>
    <script src="/themes/anime/components/ThemeTimeline.js"></script>

    <script src="/themes/anime/anime.js"></script>
</body>
</html>
